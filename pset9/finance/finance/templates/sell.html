{% extends "layout.html" %}

{% block title %}Sell{% endblock %}

{% block main %}
<h2>Sell</h2>
<form action="/sell" method="post">
  <select name="symbol">
    {% for h in holdings %}
      <option value="{{ h.symbol }}">{{ h.symbol }} ({{ h.shares }})</option>
    {% endfor %}
  </select>
  <input name="shares" placeholder="Shares">
  <button class="btn btn-primary" type="submit">Sell</button>
</form>
{% endblock %}
